{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "harness-relay.fullname" . }}
  labels:
    {{- include "harness-relay.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "harness-relay.selectorLabels" . | nindent 6 }}
      harness-relay.io/service: api
  endpoints:
    - port: http
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      path: /metrics
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.existingSecret | quote }}
          key: {{ .Values.serviceMonitor.tokenSecretKey | quote }}
{{- end }}
