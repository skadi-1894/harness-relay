{{- $reserved := list "HOST" "PORT" "HOME" "CODEX_HOME" "CLAUDE_CONFIG_DIR" "INFERENCE_API_KEY" "METRICS_TOKEN" "CLAUDE_CODE_OAUTH_TOKEN" "ANTHROPIC_API_KEY" -}}
{{- range $key, $value := .Values.env -}}
{{- if has $key $reserved -}}
{{- fail (printf "env.%s is reserved; credentials belong in existingSecret, runtime paths are fixed" $key) -}}
{{- end -}}
{{- end -}}
{{- if le (int .Values.terminationGracePeriodSeconds) (div (int (index .Values.env "SHUTDOWN_GRACE_MS" | default "30000")) 1000) -}}
{{- fail "terminationGracePeriodSeconds must exceed SHUTDOWN_GRACE_MS / 1000" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "harness-relay.fullname" . }}
  labels:
    {{- include "harness-relay.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "harness-relay.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "harness-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "harness-relay.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: inference
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret | quote }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: HOME
              value: /state
            - name: CODEX_HOME
              value: /state/codex
            - name: CLAUDE_CONFIG_DIR
              value: /state/claude
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: auth
              mountPath: /state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
        {{- if .Values.persistence.existingClaim }}
        - name: auth
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if not .Values.persistence.existingClaim }}
  volumeClaimTemplates:
    - metadata:
        name: auth
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
