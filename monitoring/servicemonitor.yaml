# Optional: requires Prometheus Operator. Add your Prometheus selector labels.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: harness-relay
  namespace: harness-relay
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: harness-relay
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: harness-relay
          key: METRICS_TOKEN
