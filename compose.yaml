services:
  inference:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      HOME: /state
      CODEX_HOME: /state/codex
      CLAUDE_CONFIG_DIR: /state/claude
    volumes:
      - auth:/state
    tmpfs:
      - /tmp:mode=1777,size=256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  auth:
