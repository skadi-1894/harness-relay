# image selects an image already built and published; tag defaults to appVersion.
image:
  repository: ghcr.io/skadi-1894/harness-relay
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
# imagePullSecrets contains existing registry Secret references.
imagePullSecrets: []
# existingSecret must contain INFERENCE_API_KEY and METRICS_TOKEN. No Secret is created by Helm.
existingSecret: harness-relay
# env contains non-secret application settings. Values are quoted in the rendered Pod.
env:
  CODEX_ENABLED: "true"
  CODEX_MODEL: gpt-6.1-sol
  CODEX_MODELS: gpt-6.1-sol
  CLAUDE_ENABLED: "true"
  CLAUDE_MODEL: sonnet
  CLAUDE_MODELS: sonnet,opus,haiku
  LOG_LEVEL: info
  MAX_CONCURRENT_REQUESTS: "2"
  REQUEST_TIMEOUT_MS: "120000"
  SHUTDOWN_GRACE_MS: "30000"
# persistence stores provider credentials; keep one replica to avoid shared refresh-token races.
persistence:
  size: 1Gi
  storageClass: ""
  existingClaim: ""
# resources bounds the gateway and its native CLI children.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
# terminationGracePeriodSeconds must exceed SHUTDOWN_GRACE_MS / 1000.
terminationGracePeriodSeconds: 40
# tmpSizeLimit caps writable scratch space.
tmpSizeLimit: 256Mi
# podAnnotations adds operator-specific annotations.
podAnnotations: {}
# nodeSelector, tolerations and affinity control placement.
nodeSelector: {}
tolerations: []
affinity: {}
# serviceMonitor optionally integrates an existing Prometheus Operator installation.
serviceMonitor:
  enabled: false
  additionalLabels: {}
  interval: 30s
  scrapeTimeout: 10s
  tokenSecretKey: METRICS_TOKEN
