# Optional standalone Prometheus config. Join Prometheus to the relay's Compose network.
# Mount a file containing only METRICS_TOKEN at /run/secrets/inference-metrics-token.
# Mount monitoring/alerts.yaml into Prometheus at /etc/prometheus/relay-alerts.yaml.
rule_files:
  - /etc/prometheus/relay-alerts.yaml
scrape_configs:
  - job_name: harness-relay
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/inference-metrics-token
    static_configs:
      - targets: ['inference:3000']
